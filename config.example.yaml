# ==============================================================================
# SMART SENTRY VISION - CONFIGURATION TEMPLATE
# ==============================================================================

# 1. Camera Input Source (USB Webcam index or RTSP IP camera URL)
camera:
  source: 0                      # 0 for /dev/video0, or "rtsp://admin:pass@192.168.1.100:554/stream"
  width: 640
  height: 480
  fps_limit: 15.0
  reconnect_interval_s: 5.0

# 2. Object Detection Engine (Pluggable: onnx, synthetic)
detector:
  backend: "onnx"                # "onnx" (default) or "synthetic" (mock for testing)
  model_path: "models/yolo11n.onnx"
  confidence_threshold: 0.50     # Detection confidence required to register
  nms_threshold: 0.45            # Non-Maximum Suppression overlap threshold
  input_size: [640, 640]
  target_classes:                # Classes that trigger intrusion alerts
    - "person"
    # - "dog"
    # - "cat"
    # - "car"

# 3. Sentry Guard Watchdog
sentry:
  enabled: false                 # Default state on startup (Arm via Telegram or Web UI)
  cooldown_seconds: 60           # Anti-spam cooldown between successive alert dispatches
  draw_boxes: true               # Draw green bounding boxes and confidence score on snapshots
  save_local_snapshots: true     # Save a copy of intruder snapshots to disk
  snapshot_dir: "snapshots"
  motion_gate_enabled: true      # Two-stage filter: skips YOLO inference when room is static (CPU ~1%)
  motion_sensitivity: 0.015      # Movement threshold: percentage of pixels changed (default: 1.5%)

# 4. Telegram Bot Integration (Bi-directional: Alerts + Remote Control)
telegram:
  enabled: false                 # Set to true after filling bot_token and chat_id
  bot_token: ""                  # Obtain from @BotFather on Telegram
  chat_id: ""                    # Your Telegram user/group ID (Use 'smart-sentry find-chat-id')
  allowed_chat_ids: []           # Optional whitelist. If empty, allows only the configured chat_id
  polling_interval_seconds: 2.0  # Background listener frequency for remote bot commands

# 5. SMTP Email Alerts (Optional Secondary Channel)
email:
  enabled: false
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender_email: ""
  sender_password: ""            # Gmail App Password (16 characters)
  recipient_email: ""

# 6. MQTT Integration (Optional Robotics / Home Assistant Bridge)
mqtt:
  enabled: false
  broker_host: "localhost"
  broker_port: 1883
  topic: "sentry/events/intrusion"

# 7. Web Dashboard & MJPEG Video Stream Server
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
