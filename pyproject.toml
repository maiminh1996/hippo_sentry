[project]
name = "hippo-sentry-vision"
version = "1.0.0"
description = "Hippo Sentry Vision - Modular Edge Camera Surveillance Engine with Telegram Bot Controls"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nguyen Anh Minh MAI", email = "mainguyenanhminh1996@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.17.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
hippo-sentry = "hippo_sentry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hippo_sentry"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
