name: hippo-sentry

services:
  hippo-sentry:
    image: hippo-sentry:latest
    build: .
    container_name: hippo-sentry
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./snapshots:/app/snapshots
      - ./hippo_sentry:/app/hippo_sentry
      - ./smart_sentry:/app/smart_sentry
      - ./hippo_icon.png:/app/hippo_icon.png:ro
      - /dev:/dev
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
